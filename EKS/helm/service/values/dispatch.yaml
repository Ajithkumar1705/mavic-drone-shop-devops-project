service:
  name: dispatch
  # dispatch is a pure RabbitMQ consumer with no app HTTP port. The only
  # listener is the Prometheus metrics server in main.go on :2112, so that is
  # the only port exposed (named "metrics" so the ServiceMonitor can target it).
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112

# Exposes orders_processed counter + Go runtime metrics at /metrics
serviceMonitor:
  enabled: true
  port: metrics
  path: /metrics
  interval: 30s

env:
  - name: AMQP_HOST
    value: "rabbitmq"
  - name: AMQP_USER
    valueFrom:
      secretKeyRef:
        name: mavic-drone-shop-runtime
        key: RABBITMQ_USER
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mavic-drone-shop-runtime
        key: RABBITMQ_PASSWORD

