service:
  name: ratings
  port: 80
  targetPort: 80

readinessProbe:
  httpGet:
    path: /_health
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
  successThreshold: 1

serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 30s

env:
  - name: PDO_USER
    value: "shipping"
  - name: PDO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mavic-drone-shop-runtime
        key: MYSQL_PASSWORD
  - name: APP_SECRET
    valueFrom:
      secretKeyRef:
        name: mavic-drone-shop-runtime
        key: APP_SECRET

