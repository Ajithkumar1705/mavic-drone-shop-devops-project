service:
  name: shipping
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 500Mi
  limits:
    cpu: 200m
    memory: 1000Mi

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
  successThreshold: 1

serviceMonitor:
  enabled: true
  port: http
  path: /actuator/prometheus
  interval: 30s

# shipping builds http://<CART_ENDPOINT>/shipping/ ; the default ("cart") would
# hit port 80, but the cart Service listens on 8080.

env:
  - name: CART_ENDPOINT
    value: "cart:8080"
  - name: DB_HOST
    value: "mysql"
  - name: DB_USER
    value: "shipping"
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mavic-drone-shop-runtime
        key: MYSQL_PASSWORD

