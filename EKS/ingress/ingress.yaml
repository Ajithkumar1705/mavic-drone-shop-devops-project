# Shared ALB ingress - kept outside the per-service chart on purpose.
# Routes everything to the nginx "web" service, which proxies /api/* to the
# other services internally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: mavic-drone-shop
  name: mavic-drone-shop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
